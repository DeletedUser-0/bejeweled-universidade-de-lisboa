<!DOCTYPE html>
<html>
    <head>
        <title>Bejeweled</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="CSS/styles.css">
    </head>
    <body class="pagina-registo">
        
        <a class="nav-back" href="index.html"><img src="Media/seta_tras.png" alt="Voltar"></a>
        <audio class="bg-music" src="Media/music.mp3"></audio>
        <button type="button" class="music-toggle">
            <img class="music-toggle__icon" src="Media/mute.png" alt="">
        </button>
        <h1>Bem-vindo ao Bejeweled - Registar</h1>
        
        <div id="registo"></div> 
            
        <form>
            <label for="email">Email: </label>
            <input type="email" id="email" name="email">
        
            <label for="password">Palavra-passe: </label>
            <input type="password" id="password" name="password"> 
        
            <label for="password2">Confirmar Palavra-Passe: </label>
            <input type="password" id="password2" name="password2"> 
        
            <label for="data-de-nascimento">Data de nascimento (DD-MM-YYYY) </label>
            <input type="date" id="data-de-nascimento" name="data-de-nascimento" min="1909-01-01" max="2026-12-31">
            

            <div class="avatar-container">
                <div class="avatares">
                    <label class="avatar">
                        <input type="radio" name="avatar" value="a.png" required>
                        <img src="Media/a.png" alt="avatar a">
                    </label>
                    <label class="avatar">
                        <input type="radio" name="avatar" value="b.png">
                        <img src="Media/b.png" alt="avatar b">
                    </label>
                    <label class="avatar">
                        <input type="radio" name="avatar" value="c.png">
                        <img src="Media/c.png" alt="avatar c">
                    </label>
                    <label class="avatar">
                        <input type="radio" name="avatar" value="d.png">
                        <img src="Media/d.png" alt="avatar d">
                    </label>
                    <!--  -->
                </div>
            </div>
            <div class="botao-registo-container">
                <button type="button" id="btn-registo" class="botoes-do-registo" disabled>Efetuar Registo</button>
            </div>
        </form>

        <script src="JavaScript/scripts.js"></script>
    </body>
</html>
