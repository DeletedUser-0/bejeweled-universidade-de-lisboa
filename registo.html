<!doctype html>
<html>
    <head>
        <title>Bejeweled</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    </head>
    <body>
        <h1>Bem-vindo ao Bejeweled - Registar</h1>

        <button id="muteBtn" class="mute-btn" aria-pressed="false" title="Mudo/Ativar som">🔊</button>

        <!-- áudio de fundo: coloque o ficheiro ../Media/music.mp3 -->
        <audio autoplay id="bgMusic" src="Media/music.mp3" controls loop></audio>
        
        <div id="registo"></div> <!--escolha de fazer login ou iniciar sessão-->
            
        <form>
            <label for="email">Email: </label>
            <input type="email" id="email" name="email" />

            <label>Palavra-passe: </label>
            <input type="password" id="password" name="password" />

            <label>Confirmar Palavra-Passe: </label>
            <input type="password" id="password2" name="password2" />

            <label>Data de nascimento (DD-MM-YYYY) </label>
            <input type="date" id="data-de-nascimento" name="data-de-nascimento" />

            <!-- 
            <label for="avatar">Escolhe o teu avatar: </label>
            <select id="avatar" name="avatar">
                <option value="">Seleciona...</option>
                <option value="avatar1">Avatar 1</option>
                <option value="avatar2">Avatar 2</option>
                <option value="avatar3">Avatar 3</option>
                
            </select> -->

            <div class="avatar-container">
                <div class="avatares">
                    <label class="avatar">
                        <input type="radio" name="avatar" value="a.png" required />
                        <img src="Media/a.png" alt="avatar a" />
                    </label>
                    <label class="avatar">
                        <input type="radio" name="avatar" value="b.png" />
                        <img src="Media/b.png" alt="avatar b" />
                    </label>
                    <label class="avatar">
                        <input type="radio" name="avatar" value="c.png" />
                        <img src="Media/c.png" alt="avatar c" />
                    </label>
                    <label class="avatar">
                        <input type="radio" name="avatar" value="d.png" />
                        <img src="Media/d.png" alt="avatar d" />
                    </label>
                    <!--  -->
                </div>
            </div>

        </form>
    </body>
</html>
