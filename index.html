<!DOCTYPE html>
<html>
    <head>
        <title>Bejeweled</title>
        <script src="scripts.js"></script>
        <link rel="stylesheet" href="CSS/styles.css">
    </head>
    <body>
        <div id="login_registo"></div> <!--escolha de fazer login ou iniciar sessão-->
            <p>Bem-vindo ao Bejeweled</p>
            <button>Registar</button>
            <br>
            <button>Iniciar sessão</button>
        <div id="menu">
            <p>Menu</p>
            <button>Single Player</button>
            <button>Multi Player</button>
            <br>
            <button>Estatísticas</button>
            <button>Definições</button>
        </div>
        
        <div id="definicoes"></div>
            <p>Definições</p>
            <button>Volume:</button>
            <!--Aqui insere-se uma barra seletiva que vai de 0 a 100-->
            <br>
            <button>Log Out</button>
        <div id="estatisticas"></div>
        <div id="registar">
            <p>Email:</p>
            <input>
            <br>
            <p>Palavra-passe:</p>
            <input>
            <P>Confirmar Palavra-Passe:</P>
            <input>
            <p>Data de nascimento (DD-MM-YYYY)</p>
            <input width="10px">/<input width="10px">/<input width="20px">
        </div>
        <div id="iniciar_sessao"></div>
        <div id="jogo"></div>
        <div id="resultados"></div>
    </body>
</html>
