<!DOCTYPE html>
<html>
<head>
    <title>Bejeweled - Jogo Terminado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body class="pagina-jogo-terminado">
    
    <audio class="bg-music" src="Media/music.mp3"></audio>
    <button type="button" class="music-toggle">
        <img class="music-toggle__icon" src="Media/mute.png" alt="">
    </button>

    <script src="JavaScript/scripts.js"></script>

    <div class="jogo-terminado-container">
        <h1 class="jogo-terminado-titulo">Jogo Terminado</h1>
        
        <div class="estatisticas-tabela-wrap">
            <table class="estatisticas-tabela">
                <thead>
                    <tr>
                        <th scope="col">Utilizador</th>
                        <th scope="col">Número de jogos SinglePlayer</th>
                        <th scope="col">Tempo total jogado</th>
                        <th scope="col">Pontuação máxima</th>
                    </tr>
                </thead>
                <tbody id="estatisticas-corpo">
                    <!-- Linhas geradas dinamicamente a partir de localStorage -->
                </tbody>
            </table>
        </div>

        <a href="menu.html" class="botao-voltar-menu">Voltar ao menu</a>
    </div>
        <script>
            (function () {
                function formatTempo(totalSegundos) {
                    var m = Math.floor(totalSegundos / 60);
                    var s = totalSegundos % 60;
                    return m + ' min ' + (s < 10 ? '0' + s : s) + ' s';
                }

                var corpo = document.getElementById('estatisticas-corpo');
                if (!corpo) return;

                var raw = localStorage.getItem('bejeweled_estatisticas');
                if (!raw) {
                    corpo.innerHTML = '<tr><td colspan="4">Sem estatísticas gravadas.</td></tr>';
                    return;
                }

                try {
                    var list = JSON.parse(raw) || [];
                } catch (e) {
                    corpo.innerHTML = '<tr><td colspan="4">Erro a ler estatísticas.</td></tr>';
                    return;
                }

                // Agregar por nome
                var mapa = {};
                list.forEach(function (e) {
                    var n = e.nome || 'anonimo';
                    if (!mapa[n]) mapa[n] = { jogos: 0, tempo: 0, maxPont: 0 };
                    mapa[n].jogos += 1;
                    mapa[n].tempo += (e.tempoSegundos || 0);
                    if ((e.pontuacao || 0) > mapa[n].maxPont) mapa[n].maxPont = e.pontuacao || 0;
                });

                // Converter mapa para array e ordenar por pontuação máxima desc
                var rows = Object.keys(mapa).map(function (k) {
                    return { nome: k, jogos: mapa[k].jogos, tempo: mapa[k].tempo, maxPont: mapa[k].maxPont };
                });
                rows.sort(function (a, b) { return b.maxPont - a.maxPont; });

                if (rows.length === 0) {
                    corpo.innerHTML = '<tr><td colspan="4">Sem estatísticas gravadas.</td></tr>';
                    return;
                }

                var html = '';
                rows.forEach(function (r) {
                    html += '<tr>' +
                                    '<th scope="row">' + (r.nome) + '</th>' +
                                    '<td>' + r.jogos + '</td>' +
                                    '<td>' + formatTempo(r.tempo) + '</td>' +
                                    '<td>' + r.maxPont.toLocaleString() + '</td>' +
                                    '</tr>';
                });

                corpo.innerHTML = html;
            })();
        </script>
</body>
</html>
